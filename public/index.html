<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Cut — Background Remover</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <div class="app-shell">
      <header class="navbar">
        <div class="brand">
          <span class="brand-title">Studio Cut</span>
        </div>

        <div class="nav-controls">
          <div class="usage-meter" id="usageBadge">
            <span id="usageText">5 / 5 Credits Left</span>
          </div>

          <!-- Light/Dark Theme Toggle Button -->
          <button
            id="themeToggleBtn"
            class="btn-icon"
            title="Toggle Light/Dark Theme"
            aria-label="Toggle Theme"
          >
            <svg
              class="sun-icon hidden"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg
              class="moon-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <button id="resetBtn" class="btn btn-ghost hidden">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            Reset
          </button>
        </div>
      </header>

      <main class="workspace-grid">
        <section class="stage-card">
          <div id="dropZone" class="drop-zone">
            <div class="icon-circle">
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <div class="drop-text">
              <p class="primary-text">
                <span class="link-text">Click to upload</span> or drag photo
                here
              </p>
              <p class="secondary-text">Supports PNG, JPG, WEBP (Max 10MB)</p>
            </div>
            <input
              type="file"
              id="fileInput"
              accept="image/png, image/jpeg, image/webp"
              hidden
            />
          </div>

          <div id="canvasStage" class="canvas-stage hidden">
            <div id="canvasWrapper" class="canvas-wrapper">
              <canvas id="outputCanvas"></canvas>
            </div>

            <div id="shimmerOverlay" class="shimmer-overlay hidden"></div>
            <div id="bottomLoader" class="bottom-loader-bar hidden">
              <div class="spinner-ring"></div>
              <p id="loaderMessage" class="loader-primary">Taking a look at your photo...</p>
            </div>
          </div>
        </section>

        <section id="controlPanel" class="controls-card disabled">
          <div class="control-group">
            <label class="group-title"
              >1. Aspect Ratio & Preset Dimensions</label
            >
            <div class="aspect-grid">
              <button class="aspect-btn active" data-ratio="original">
                <span class="aspect-label">Original Ratio</span>
              </button>
              <button class="aspect-btn passport-pill" data-ratio="passport">
                <span class="aspect-label">Passport (2x2)</span>
                <span class="badge-preset">Auto Setup</span>
              </button>
              <button class="aspect-btn" data-ratio="1:1">
                <span class="aspect-label">1:1 Square</span>
              </button>
              <button class="aspect-btn" data-ratio="16:9">
                <span class="aspect-label">16:9 Wide</span>
              </button>
            </div>
          </div>

          <div class="control-group">
            <div class="group-header">
              <label class="group-title">2. Solid Background Color</label>
              <span id="selectedHexLabel" class="hex-badge">TRANSPARENT</span>
            </div>

            <div class="color-swatches-wrapper">
              <button
                class="swatch active"
                data-color="transparent"
                title="Transparent"
              >
                <span class="checkerboard"></span>
              </button>
              <button
                class="swatch"
                data-color="#ffffff"
                style="background: #ffffff"
                title="Studio White"
              ></button>
              <button
                class="swatch"
                data-color="#0055a5"
                style="background: #0055a5"
                title="Passport Blue"
              ></button>
              <button
                class="swatch"
                data-color="#f8fafc"
                style="background: #f8fafc"
                title="Off White"
              ></button>
              <button
                class="swatch"
                data-color="#0f172a"
                style="background: #0f172a"
                title="Dark Slate"
              ></button>
              <button
                class="swatch"
                data-color="#dc2626"
                style="background: #dc2626"
                title="Red"
              ></button>

              <div class="custom-color-picker" title="Choose Custom Color">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
                  />
                </svg>
                <span>Custom</span>
                <input type="color" id="customColorInput" value="#2563eb" />
              </div>
            </div>
          </div>

          <button id="downloadBtn" class="btn btn-primary btn-large" disabled>
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Download HD Image
          </button>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
